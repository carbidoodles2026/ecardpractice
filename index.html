<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice E-Card Studio (Borders + Fonts + Photo)</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 980px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            color: #e2e8f0;
        }

        .section-title {
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid #334155;
            font-size: 0.9rem;
            font-weight: 700;
            color: #93c5fd;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        .row-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
            font-family: inherit;
        }

        input[type="color"] {
            padding: 4px;
            height: 42px;
            cursor: pointer;
        }

        input[type="file"] {
            padding: 8px;
            font-size: 0.85rem;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 18px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-primary {
            background: #22c55e;
            color: #052e16;
        }

        .btn-primary:hover {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        /* Preview Card */
        .preview-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 20px;
            padding: 36px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
            background-color: #1e293b;
        }

        .card-bg-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            transform-origin: center center;
        }

        .card-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* Decorative frame sa loob ng card */
        .card-frame {
            position: absolute;
            inset: 14px;
            border-radius: 14px;
            z-index: 2;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        .card-content {
            position: relative;
            z-index: 3;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.82);
            color: #fef08a;
            text-shadow: none;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .card-to {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 14px;
            line-height: 1.25;
        }

        .card-msg {
            font-size: 1.05rem;
            line-height: 1.55;
            margin: 18px 0;
            white-space: pre-line;
        }

        .card-from {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Kaliwa: Controls -->
        <div class="panel">
            <h2>Customize E-Card</h2>

            <label for="themeInput">Occasion / Badge</label>
            <select id="themeInput" onchange="renderCard()">
                <option value="birthday">Happy Birthday</option>
                <option value="holiday">Holiday / Season's Greetings</option>
                <option value="thinking">Thinking of You</option>
                <option value="thanks">Thank You</option>
            </select>

            <div class="section-title">Background & Photo</div>

            <label for="photoInput">Background Picture (Upload mula sa device)</label>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)">

            <div class="row-2">
                <div>
                    <label for="fitModeInput">Photo Fit Mode</label>
                    <select id="fitModeInput" onchange="renderCard()">
                        <option value="contain">Fit Whole Photo</option>
                        <option value="cover">Fill Full Card</option>
                    </select>
                </div>
                <div>
                    <label for="bgColorInput">Card Base Color</label>
                    <input type="color" id="bgColorInput" value="#8c7344" oninput="renderCard()">
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label for="zoomInput">Photo Zoom (<span id="zoomVal">100%</span>)</label>
                    <input type="range" id="zoomInput" min="80" max="160" value="100" oninput="renderCard()">
                </div>
                <div>
                    <label for="tintInput">Dark Tint (<span id="tintVal">35%</span>)</label>
                    <input type="range" id="tintInput" min="0" max="80" value="35" oninput="renderCard()">
                </div>
            </div>

            <div class="section-title">Card Border / Frame</div>

            <div class="row-2">
                <div>
                    <label for="borderStyleInput">Border Style</label>
                    <select id="borderStyleInput" onchange="renderCard()">
                        <option value="solid">Classic Solid Frame</option>
                        <option value="double">Double Royal Frame</option>
                        <option value="dashed">Stitched / Dashed Frame</option>
                        <option value="dotted">Dotted Playful Frame</option>
                        <option value="none">No Border</option>
                    </select>
                </div>
                <div>
                    <label for="borderColorInput">Border Color</label>
                    <input type="color" id="borderColorInput" value="#facc15" oninput="renderCard()">
                </div>
            </div>

            <label for="borderWidthInput">Border Thickness (<span id="borderWidthVal">4px</span>)</label>
            <input type="range" id="borderWidthInput" min="1" max="12" value="4" oninput="renderCard()">

            <div class="section-title">Font Style, Color & Size</div>

            <div class="row-2">
                <div>
                    <label for="fontTypeInput">Font Type</label>
                    <select id="fontTypeInput" onchange="renderCard()">
                        <option value="sans">Clean Modern (Sans)</option>
                        <option value="serif">Classic Formal (Serif)</option>
                        <option value="script">Sweet Script (Cursive)</option>
                        <option value="mono">Typewriter (Mono)</option>
                    </select>
                </div>
                <div>
                    <label for="fontColorInput">Font Color</label>
                    <input type="color" id="fontColorInput" value="#ffffff" oninput="renderCard()">
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label for="fontSizeInput">Font Size (<span id="fontSizeVal">100%</span>)</label>
                    <input type="range" id="fontSizeInput" min="75" max="140" value="100" oninput="renderCard()">
                </div>
                <div>
                    <label for="shadowToggle">Text Shadow</label>
                    <select id="shadowToggle" onchange="renderCard()">
                        <option value="on">On (Mas litaw sa photo)</option>
                        <option value="off">Off (Malinis / Flat)</option>
                    </select>
                </div>
            </div>

            <div class="section-title">Card Message</div>

            <label for="toInput">To (Para kanino?)</label>
            <input type="text" id="toInput" placeholder="e.g. Uncle & Auntie" oninput="renderCard()">

            <label for="msgInput">Personalized Message</label>
            <textarea id="msgInput" oninput="renderCard()">Wishing you warmth, good health, and plenty of smiles today and always.</textarea>

            <label for="fromInput">From (Galing kanino?)</label>
            <input type="text" id="fromInput" placeholder="e.g. With love" oninput="renderCard()">

            <div class="btn-row">
                <button class="btn-primary" onclick="downloadCardPNG()">Download PNG</button>
                <button class="btn-secondary" onclick="resetCard()">Reset</button>
            </div>
        </div>

        <!-- Kanan: Live Preview -->
        <div class="panel preview-wrap">
            <h2>Live Preview</h2>
            <div id="cardPreview" class="card">
                <img id="cardBgImg" class="card-bg-img" alt="" style="display: none;">
                <div id="cardOverlay" class="card-overlay"></div>
                <div id="cardFrame" class="card-frame"></div>
                <div id="cardContent" class="card-content">
                    <div>
                        <div id="cardBadge" class="badge">Season's Greetings</div>
                        <div id="cardTo" class="card-to">To: Someone Special</div>
                    </div>
                    <div id="cardMsg" class="card-msg">Wishing you warmth, good health, and plenty of smiles today and always.</div>
                    <div id="cardFrom" class="card-from">From: Your Family</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const themeLabels = {
            birthday: 'Happy Birthday',
            holiday: "Season's Greetings",
            thinking: 'Thinking of You',
            thanks: 'Thank You'
        };

        const fontFamilies = {
            sans: {
                css: 'system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif',
                canvas: 'system-ui, -apple-system, "Segoe UI", sans-serif'
            },
            serif: {
                css: 'Georgia, "Times New Roman", Times, serif',
                canvas: 'Georgia, "Times New Roman", serif'
            },
            script: {
                css: '"Brush Script MT", "Segoe Script", "Lucida Handwriting", cursive',
                canvas: '"Brush Script MT", "Segoe Script", cursive'
            },
            mono: {
                css: 'ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace',
                canvas: 'monospace'
            }
        };

        let uploadedImg = null;

        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImg = img;
                    renderCard();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCard() {
            const theme = document.getElementById('themeInput').value;
            const fitMode = document.getElementById('fitModeInput').value;
            const bgColor = document.getElementById('bgColorInput').value;
            const zoom = parseInt(document.getElementById('zoomInput').value, 10) || 100;
            const tint = parseInt(document.getElementById('tintInput').value, 10) || 0;

            const borderStyle = document.getElementById('borderStyleInput').value;
            const borderColor = document.getElementById('borderColorInput').value;
            const borderWidth = parseInt(document.getElementById('borderWidthInput').value, 10) || 0;

            const fontType = document.getElementById('fontTypeInput').value;
            const fontColor = document.getElementById('fontColorInput').value;
            const fontSizePct = parseInt(document.getElementById('fontSizeInput').value, 10) || 100;
            const shadowMode = document.getElementById('shadowToggle').value;

            const toVal = document.getElementById('toInput').value.trim();
            const msgVal = document.getElementById('msgInput').value.trim();
            const fromVal = document.getElementById('fromInput').value.trim();

            document.getElementById('zoomVal').innerText = `${zoom}%`;
            document.getElementById('tintVal').innerText = `${tint}%`;
            document.getElementById('borderWidthVal').innerText = `${borderWidth}px`;
            document.getElementById('fontSizeVal').innerText = `${fontSizePct}%`;

            const card = document.getElementById('cardPreview');
            const bgImg = document.getElementById('cardBgImg');
            const overlay = document.getElementById('cardOverlay');
            const frame = document.getElementById('cardFrame');
            const content = document.getElementById('cardContent');
            const toEl = document.getElementById('cardTo');
            const msgEl = document.getElementById('cardMsg');
            const fromEl = document.getElementById('cardFrom');

            card.style.backgroundColor = bgColor;
            card.style.backgroundImage = 'none';

            if (uploadedImg) {
                bgImg.src = uploadedImg.src;
                bgImg.style.display = 'block';
                bgImg.style.objectFit = fitMode;
                bgImg.style.objectPosition = 'center center';
                bgImg.style.transform = `scale(${zoom / 100})`;
            } else {
                bgImg.style.display = 'none';
                card.style.background = `linear-gradient(135deg, ${bgColor} 0%, #1e293b 100%)`;
            }

            overlay.style.background = `rgba(15, 23, 42, ${tint / 100})`;

            // Border styling sa frame
            if (borderStyle === 'none' || borderWidth <= 0) {
                frame.style.border = 'none';
                frame.style.boxShadow = 'none';
            } else {
                // Sa CSS 'double', kailangan kahit papaano may 3px+ para klaro ang dalawang linya
                const effectiveWidth = borderStyle === 'double' ? Math.max(borderWidth, 4) : borderWidth;
                frame.style.border = `${effectiveWidth}px ${borderStyle} ${borderColor}`;
                frame.style.boxShadow = `0 0 12px rgba(0, 0, 0, 0.35)`;
            }

            // Font styling
            const chosenFont = fontFamilies[fontType] || fontFamilies.sans;
            content.style.fontFamily = chosenFont.css;
            content.style.color = fontColor;
            content.style.textShadow = shadowMode === 'on' ? '0 2px 10px rgba(0, 0, 0, 0.78)' : 'none';

            const scale = fontSizePct / 100;
            toEl.style.fontSize = `${(1.5 * scale).toFixed(2)}rem`;
            msgEl.style.fontSize = `${(1.05 * scale).toFixed(2)}rem`;
            fromEl.style.fontSize = `${(0.95 * scale).toFixed(2)}rem`;

            document.getElementById('cardBadge').innerText = themeLabels[theme] || 'Greeting Card';
            toEl.innerText = toVal ? `To: ${toVal}` : 'To: Someone Special';
            msgEl.innerText = msgVal || 'Your message goes here...';
            fromEl.innerText = fromVal ? `From: ${fromVal}` : 'From: Your Family';
        }

        function resetCard() {
            uploadedImg = null;
            document.getElementById('photoInput').value = '';
            document.getElementById('themeInput').value = 'birthday';
            document.getElementById('fitModeInput').value = 'contain';
            document.getElementById('bgColorInput').value = '#8c7344';
            document.getElementById('zoomInput').value = 100;
            document.getElementById('tintInput').value = 35;
            document.getElementById('borderStyleInput').value = 'solid';
            document.getElementById('borderColorInput').value = '#facc15';
            document.getElementById('borderWidthInput').value = 4;
            document.getElementById('fontTypeInput').value = 'sans';
            document.getElementById('fontColorInput').value = '#ffffff';
            document.getElementById('fontSizeInput').value = 100;
            document.getElementById('shadowToggle').value = 'on';
            document.getElementById('toInput').value = '';
            document.getElementById('msgInput').value = 'Wishing you warmth, good health, and plenty of smiles today and always.';
            document.getElementById('fromInput').value = '';
            renderCard();
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;

            paragraphs.forEach((para) => {
                const words = para.split(' ');
                let line = '';

                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && i > 0) {
                        ctx.fillText(line.trim(), x, currentY);
                        line = words[i] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line.trim(), x, currentY);
                currentY += lineHeight;
            });
        }

        function drawCanvasBorder(ctx, width, height, style, color, thicknessPx) {
            if (style === 'none' || thicknessPx <= 0) return;

            // I-scale nang proporsyonal para sa 800x1000 canvas
            const w = Math.max(2, Math.round(thicknessPx * 2.2));
            const inset = 28;
            const rectW = width - inset * 2;
            const rectH = height - inset * 2;
            const radius = 24;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
            ctx.shadowBlur = 8;

            function drawRoundedRectPath(x, y, rw, rh, r) {
                ctx.beginPath();
                ctx.roundRect(x, y, rw, rh, r);
            }

            if (style === 'solid') {
                ctx.lineWidth = w;
                ctx.setLineDash([]);
                drawRoundedRectPath(inset, inset, rectW, rectH, radius);
                ctx.stroke();
            } else if (style === 'dashed') {
                ctx.lineWidth = w;
                ctx.setLineDash([w * 3.5, w * 2.2]);
                drawRoundedRectPath(inset, inset, rectW, rectH, radius);
                ctx.stroke();
            } else if (style === 'dotted') {
                ctx.lineWidth = w;
                ctx.lineCap = 'round';
                ctx.setLineDash([1, w * 2.4]);
                drawRoundedRectPath(inset, inset, rectW, rectH, radius);
                ctx.stroke();
            } else if (style === 'double') {
                const outerW = Math.max(2, Math.round(w * 0.45));
                const gap = Math.max(8, Math.round(w * 0.65));
                ctx.lineWidth = outerW;
                ctx.setLineDash([]);

                drawRoundedRectPath(inset, inset, rectW, rectH, radius);
                ctx.stroke();

                drawRoundedRectPath(
                    inset + gap,
                    inset + gap,
                    rectW - gap * 2,
                    rectH - gap * 2,
                    Math.max(8, radius - gap / 2)
                );
                ctx.stroke();
            }

            ctx.restore();
        }

        function downloadCardPNG() {
            const theme = document.getElementById('themeInput').value;
            const fitMode = document.getElementById('fitModeInput').value;
            const bgColor = document.getElementById('bgColorInput').value;
            const zoom = (parseInt(document.getElementById('zoomInput').value, 10) || 100) / 100;
            const tint = parseInt(document.getElementById('tintInput').value, 10) || 0;

            const borderStyle = document.getElementById('borderStyleInput').value;
            const borderColor = document.getElementById('borderColorInput').value;
            const borderWidth = parseInt(document.getElementById('borderWidthInput').value, 10) || 0;

            const fontType = document.getElementById('fontTypeInput').value;
            const fontColor = document.getElementById('fontColorInput').value;
            const fontScale = (parseInt(document.getElementById('fontSizeInput').value, 10) || 100) / 100;
            const shadowMode = document.getElementById('shadowToggle').value;

            const toVal = document.getElementById('toInput').value.trim() || 'Someone Special';
            const msgVal = document.getElementById('msgInput').value.trim() || 'Your message goes here...';
            const fromVal = document.getElementById('fromInput').value.trim() || 'Your Family';
            const badgeText = themeLabels[theme] || 'Greeting Card';

            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // 1. Base color
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 2. Photo with Fit Mode + Zoom
            if (uploadedImg) {
                const imgRatio = uploadedImg.width / uploadedImg.height;
                const canvasRatio = canvas.width / canvas.height;
                let baseW, baseH;

                if (fitMode === 'cover') {
                    if (imgRatio > canvasRatio) {
                        baseH = canvas.height;
                        baseW = imgRatio * baseH;
                    } else {
                        baseW = canvas.width;
                        baseH = baseW / imgRatio;
                    }
                } else {
                    if (imgRatio > canvasRatio) {
                        baseW = canvas.width;
                        baseH = baseW / imgRatio;
                    } else {
                        baseH = canvas.height;
                        baseW = imgRatio * baseH;
                    }
                }

                const drawW = baseW * zoom;
                const drawH = baseH * zoom;
                const offsetX = (canvas.width - drawW) / 2;
                const offsetY = (canvas.height - drawH) / 2;

                ctx.drawImage(uploadedImg, offsetX, offsetY, drawW, drawH);
            }

            // 3. Dark tint overlay
            ctx.fillStyle = `rgba(15, 23, 42, ${tint / 100})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 4. Card Border
            drawCanvasBorder(ctx, canvas.width, canvas.height, borderStyle, borderColor, borderWidth);

            // 5. Badge
            ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
            ctx.beginPath();
            ctx.roundRect(220, 95, 360, 56, 28);
            ctx.fill();

            ctx.fillStyle = '#fef08a';
            ctx.font = 'bold 24px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badgeText.toUpperCase(), 400, 123);

            // 6. Text with chosen Font Type, Color, Size & Shadow
            const chosenFont = (fontFamilies[fontType] || fontFamilies.sans).canvas;
            ctx.fillStyle = fontColor;

            if (shadowMode === 'on') {
                ctx.shadowColor = 'rgba(0, 0, 0, 0.78)';
                ctx.shadowBlur = 10;
            } else {
                ctx.shadowColor = 'transparent';
                ctx.shadowBlur = 0;
            }

            const toSize = Math.round(42 * fontScale);
            const msgSize = Math.round(32 * fontScale);
            const fromSize = Math.round(28 * fontScale);
            const lineHeight = Math.round(48 * fontScale);

            ctx.font = `bold ${toSize}px ${chosenFont}`;
            ctx.fillText(`To: ${toVal}`, 400, 245);

            ctx.font = `500 ${msgSize}px ${chosenFont}`;
            wrapText(ctx, msgVal, 400, 390, 620, lineHeight);

            ctx.font = `600 ${fromSize}px ${chosenFont}`;
            ctx.fillText(`From: ${fromVal}`, 400, 860);

            const link = document.createElement('a');
            link.download = `ecard-${theme}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        renderCard();
    </script>
</body>
</html>
