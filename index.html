<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice E-Card Studio (Photo Background)</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            margin: 0;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 940px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            align-items: start;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
        }

        h2 {
            margin: 0 0 14px 0;
            font-size: 1.15rem;
            color: #e2e8f0;
        }

        label {
            display: block;
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 12px;
            margin-bottom: 4px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #f8fafc;
            font-size: 0.95rem;
        }

        input[type="file"] {
            padding: 8px;
            font-size: 0.85rem;
        }

        textarea {
            min-height: 95px;
            resize: vertical;
        }

        .hint {
            font-size: 0.78rem;
            color: #94a3b8;
            margin-top: 6px;
            line-height: 1.4;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 16px;
        }

        button {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .btn-primary {
            background: #22c55e;
            color: #052e16;
        }

        .btn-primary:hover {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        /* Card Preview */
        .preview-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            width: 100%;
            aspect-ratio: 4 / 5;
            border-radius: 20px;
            padding: 32px 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            text-align: center;
            box-shadow: 0 18px 36px rgba(0, 0, 0, 0.45);
            position: relative;
            overflow: hidden;
            background-size: cover;
            background-position: center;
        }

        /* Manipis na patong sa ibabaw ng picture para mabasa nang malinaw ang text */
        .card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.45);
            z-index: 1;
        }

        .card-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin: 0 auto;
            background: rgba(15, 23, 42, 0.8);
            color: #fef08a;
            text-shadow: none;
        }

        .card-to {
            font-size: 1.5rem;
            font-weight: 800;
            margin-top: 14px;
            line-height: 1.25;
        }

        .card-msg {
            font-size: 1.05rem;
            line-height: 1.6;
            margin: 18px 0;
            white-space: pre-line;
        }

        .card-from {
            font-size: 0.95rem;
            font-weight: 600;
            opacity: 0.95;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Kaliwa: Controls -->
        <div class="panel">
            <h2>Customize E-Card</h2>

            <label for="themeInput">Occasion / Badge</label>
            <select id="themeInput" onchange="renderCard()">
                <option value="birthday">Happy Birthday</option>
                <option value="holiday">Holiday / Season's Greetings</option>
                <option value="thinking">Thinking of You</option>
                <option value="thanks">Thank You</option>
            </select>

            <label for="photoInput">Background Picture (Upload mula sa device)</label>
            <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoUpload(event)">
            <div class="hint">Tip: Pumili ng malinaw na photo (JPG/PNG). May dark tint na nakapatong para hindi malabo ang sulat.</div>

            <label for="tintInput">Dilim ng Patong / Tint (0% hanggang 80%)</label>
            <input type="range" id="tintInput" min="0" max="80" value="45" oninput="renderCard()">
            <div class="hint">Current tint: <span id="tintValue">45%</span></div>

            <label for="toInput">To (Para kanino?)</label>
            <input type="text" id="toInput" placeholder="e.g. Uncle & Auntie" oninput="renderCard()">

            <label for="msgInput">Personalized Message</label>
            <textarea id="msgInput" oninput="renderCard()">Wishing you warmth, good health, and plenty of smiles today and always.</textarea>

            <label for="fromInput">From (Galing kanino?)</label>
            <input type="text" id="fromInput" placeholder="e.g. With love" oninput="renderCard()">

            <div class="btn-row">
                <button class="btn-primary" onclick="downloadCardPNG()">Download PNG</button>
                <button class="btn-secondary" onclick="resetCard()">Reset</button>
            </div>
        </div>

        <!-- Kanan: Live Preview -->
        <div class="panel preview-wrap">
            <h2>Live Preview</h2>
            <div id="cardPreview" class="card">
                <div id="cardOverlay" class="card-overlay"></div>
                <div class="card-content">
                    <div>
                        <div id="cardBadge" class="badge">Happy Birthday</div>
                        <div id="cardTo" class="card-to">To: Someone Special</div>
                    </div>
                    <div id="cardMsg" class="card-msg">Wishing you warmth, good health, and plenty of smiles today and always.</div>
                    <div id="cardFrom" class="card-from">From: Your Family</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const themeLabels = {
            birthday: 'Happy Birthday',
            holiday: "Season's Greetings",
            thinking: 'Thinking of You',
            thanks: 'Thank You'
        };

        let uploadedImg = null; // Dito natin itatago ang na-upload na Image object

        // Kapag pumili ng picture ang user mula sa device
        function handlePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImg = img;
                    renderCard();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function renderCard() {
            const theme = document.getElementById('themeInput').value;
            const toVal = document.getElementById('toInput').value.trim();
            const msgVal = document.getElementById('msgInput').value.trim();
            const fromVal = document.getElementById('fromInput').value.trim();
            const tint = parseInt(document.getElementById('tintInput').value, 10) || 0;

            document.getElementById('tintValue').innerText = `${tint}%`;

            const card = document.getElementById('cardPreview');
            const overlay = document.getElementById('cardOverlay');

            if (uploadedImg) {
                card.style.backgroundImage = `url('${uploadedImg.src}')`;
                card.style.backgroundColor = '#1e293b';
            } else {
                card.style.backgroundImage = 'none';
                card.style.background = 'linear-gradient(135deg, #1d4ed8 0%, #7e22ce 100%)';
            }

            overlay.style.background = `rgba(15, 23, 42, ${tint / 100})`;

            document.getElementById('cardBadge').innerText = themeLabels[theme] || 'Greeting Card';
            document.getElementById('cardTo').innerText = toVal ? `To: ${toVal}` : 'To: Someone Special';
            document.getElementById('cardMsg').innerText = msgVal || 'Your message goes here...';
            document.getElementById('cardFrom').innerText = fromVal ? `From: ${fromVal}` : 'From: Your Family';
        }

        function resetCard() {
            uploadedImg = null;
            document.getElementById('photoInput').value = '';
            document.getElementById('themeInput').value = 'birthday';
            document.getElementById('tintInput').value = 45;
            document.getElementById('toInput').value = '';
            document.getElementById('msgInput').value = 'Wishing you warmth, good health, and plenty of smiles today and always.';
            document.getElementById('fromInput').value = '';
            renderCard();
        }

        function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
            const paragraphs = text.split('\n');
            let currentY = y;

            paragraphs.forEach((para) => {
                const words = para.split(' ');
                let line = '';

                for (let i = 0; i < words.length; i++) {
                    const testLine = line + words[i] + ' ';
                    const metrics = ctx.measureText(testLine);
                    if (metrics.width > maxWidth && i > 0) {
                        ctx.fillText(line.trim(), x, currentY);
                        line = words[i] + ' ';
                        currentY += lineHeight;
                    } else {
                        line = testLine;
                    }
                }
                ctx.fillText(line.trim(), x, currentY);
                currentY += lineHeight;
            });
        }

        function downloadCardPNG() {
            const theme = document.getElementById('themeInput').value;
            const toVal = document.getElementById('toInput').value.trim() || 'Someone Special';
            const msgVal = document.getElementById('msgInput').value.trim() || 'Your message goes here...';
            const fromVal = document.getElementById('fromInput').value.trim() || 'Your Family';
            const tint = parseInt(document.getElementById('tintInput').value, 10) || 0;
            const badgeText = themeLabels[theme] || 'Greeting Card';

            const canvas = document.createElement('canvas');
            canvas.width = 800;
            canvas.height = 1000;
            const ctx = canvas.getContext('2d');

            // 1. Iguhit ang background (picture kung meron, kung wala ay gradient)
            if (uploadedImg) {
                // Parang "background-size: cover" para hindi ma-stretch nang pangit ang picture
                const imgRatio = uploadedImg.width / uploadedImg.height;
                const canvasRatio = canvas.width / canvas.height;
                let drawW, drawH, offsetX, offsetY;

                if (imgRatio > canvasRatio) {
                    drawH = canvas.height;
                    drawW = imgRatio * drawH;
                    offsetX = (canvas.width - drawW) / 2;
                    offsetY = 0;
                } else {
                    drawW = canvas.width;
                    drawH = drawW / imgRatio;
                    offsetX = 0;
                    offsetY = (canvas.height - drawH) / 2;
                }
                ctx.drawImage(uploadedImg, offsetX, offsetY, drawW, drawH);
            } else {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#1d4ed8');
                grad.addColorStop(1, '#7e22ce');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // 2. Dark overlay tint para litaw ang text
            ctx.fillStyle = `rgba(15, 23, 42, ${tint / 100})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 3. Badge box
            ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
            ctx.beginPath();
            ctx.roundRect(220, 90, 360, 56, 28);
            ctx.fill();

            ctx.fillStyle = '#fef08a';
            ctx.font = 'bold 24px system-ui, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(badgeText.toUpperCase(), 400, 118);

            // 4. Text sa ibabaw
            ctx.fillStyle = '#ffffff';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.75)';
            ctx.shadowBlur = 10;

            ctx.font = 'bold 42px system-ui, sans-serif';
            ctx.fillText(`To: ${toVal}`, 400, 240);

            ctx.font = '500 32px system-ui, sans-serif';
            wrapText(ctx, msgVal, 400, 390, 640, 48);

            ctx.font = '600 28px system-ui, sans-serif';
            ctx.fillText(`From: ${fromVal}`, 400, 860);

            const link = document.createElement('a');
            link.download = `ecard-${theme}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }

        // Unang render pagbukas
        renderCard();
    </script>
</body>
</html>
